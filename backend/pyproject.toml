[project]
name = "ats-resume-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.5",
    "pydantic-settings==2.7.1",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.20",
    "pdfplumber==0.11.4",
    "python-docx==1.1.2",
    "google-genai==1.7.0",
    "tenacity==9.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.pydantic]
warn_deprecated_class_config = false